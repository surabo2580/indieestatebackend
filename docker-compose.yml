services:
  postgres:
    image: postgres:16-alpine
    container_name: indieestate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-indieestate}
      POSTGRES_USER: ${POSTGRES_USER:-surajdas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surajdas}
    ports:
      - "5432:5432"
    volumes:
      - indieestate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surajdas} -d ${POSTGRES_DB:-indieestate}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  indieestate_postgres_data:
