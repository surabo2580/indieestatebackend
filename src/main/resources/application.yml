spring:
  application:
    name: indieestate-backend
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:indieestate}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${POSTGRES_USER:surajdas}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:surajdas}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 80MB
      max-request-size: 80MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:indieestate-media-workers}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      auto-startup: ${REELS_KAFKA_ENABLED:false}

server:
  port: ${PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-at-least-32-chars}
    issuer: ${JWT_ISSUER:indieestate-backend}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:7200}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  reels:
    upload-dir: ${REELS_UPLOAD_DIR:uploads/reels}
    s3-bucket: ${REELS_S3_BUCKET:}
    s3-region: ${AWS_REGION:ap-south-1}
    cdn-base-url: ${REELS_CDN_BASE_URL:}
    ffmpeg-path: ${REELS_FFMPEG_PATH:ffmpeg}
    kafka-enabled: ${REELS_KAFKA_ENABLED:false}
    redis-enabled: ${REELS_REDIS_ENABLED:false}
    kafka:
      uploaded-topic: video.uploaded
      processed-topic: video.processed
      watch-topic: video.watch
      like-topic: video.like
      share-topic: video.share
      completed-topic: video.completed
      worker-group: indieestate-media-workers

management:
  health:
    redis:
      enabled: ${REELS_REDIS_ENABLED:false}
    kafka:
      enabled: ${REELS_KAFKA_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:indieestate;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

app:
  reels:
    kafka-enabled: false
    redis-enabled: false
